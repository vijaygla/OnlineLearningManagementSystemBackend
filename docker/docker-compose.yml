version: '3.8'

services:

  identityservice:
    build:
      context: ..
      dockerfile: docker/services/identity/Dockerfile
    ports:
      - "5001:80"
    environment:
      - ConnectionStrings__DefaultConnection=${AZURE_SQL_CONNECTION}

  courseservice:
    build:
      context: ..
      dockerfile: docker/services/course/Dockerfile
    ports:
      - "5002:80"
    environment:
      - ConnectionStrings__DefaultConnection=${AZURE_SQL_CONNECTION}

  apigateway:
    build:
      context: ..
      dockerfile: docker/gateway/Dockerfile
    ports:
      - "5000:80"
