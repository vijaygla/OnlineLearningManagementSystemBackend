version: '3.8'

services:

  identityservice:
    build:
      context: ..
      dockerfile: docker/services/identity/Dockerfile
    ports:
      - "5001:80"
    environment:
      - ConnectionStrings__DefaultConnection=${AZURE_SQL_CONNECTION}
      - JWT_SECRET=${JWT_SECRET}

  courseservice:
    build:
      context: ..
      dockerfile: docker/services/course/Dockerfile
    ports:
      - "5002:80"
    environment:
      - ConnectionStrings__DefaultConnection=${AZURE_SQL_CONNECTION}
      - JWT_SECRET=${JWT_SECRET}

  categoryservice:
    build:
      context: ..
      dockerfile: docker/services/category/Dockerfile
    ports:
      - "5003:80"
    environment:
      - ConnectionStrings__DefaultConnection=${AZURE_SQL_CONNECTION}
      - JWT_SECRET=${JWT_SECRET}

  contentservice:
    build:
      context: ..
      dockerfile: docker/services/content/Dockerfile
    ports:
      - "5004:80"
    environment:
      - ConnectionStrings__DefaultConnection=${AZURE_SQL_CONNECTION}
      - JWT_SECRET=${JWT_SECRET}

  enrollmentservice:
    build:
      context: ..
      dockerfile: docker/services/enrollment/Dockerfile
    ports:
      - "5005:80"
    environment:
      - ConnectionStrings__DefaultConnection=${AZURE_SQL_CONNECTION}
      - JWT_SECRET=${JWT_SECRET}

  progressservice:
    build:
      context: ..
      dockerfile: docker/services/progress/Dockerfile
    ports:
      - "5006:80"
    environment:
      - ConnectionStrings__DefaultConnection=${AZURE_SQL_CONNECTION}
      - JWT_SECRET=${JWT_SECRET}

  assessmentservice:
    build:
      context: ..
      dockerfile: docker/services/assessment/Dockerfile
    ports:
      - "5007:80"
    environment:
      - ConnectionStrings__DefaultConnection=${AZURE_SQL_CONNECTION}
      - JWT_SECRET=${JWT_SECRET}

  certificateservice:
    build:
      context: ..
      dockerfile: docker/services/certificate/Dockerfile
    ports:
      - "5008:80"
    environment:
      - ConnectionStrings__DefaultConnection=${AZURE_SQL_CONNECTION}
      - JWT_SECRET=${JWT_SECRET}

  reviewservice:
    build:
      context: ..
      dockerfile: docker/services/review/Dockerfile
    ports:
      - "5009:80"
    environment:
      - ConnectionStrings__DefaultConnection=${AZURE_SQL_CONNECTION}
      - JWT_SECRET=${JWT_SECRET}

  notificationservice:
    build:
      context: ..
      dockerfile: docker/services/notification/Dockerfile
    ports:
      - "5010:80"
    environment:
      - ConnectionStrings__DefaultConnection=${AZURE_SQL_CONNECTION}
      - JWT_SECRET=${JWT_SECRET}
      - RabbitMQ__Host=rabbitmq
      - Smtp__Host=mailhog
      - Smtp__Port=1025
      - Smtp__SenderEmail=noreply@lms.com
      - Smtp__SenderName=LMS Notifications

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  apigateway:
    build:
      context: ..
      dockerfile: docker/gateway/Dockerfile
    ports:
      - "5000:80"
    environment:
      - ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address=http://identityservice:80
      - ReverseProxy__Clusters__category-cluster__Destinations__destination1__Address=http://categoryservice:80
      - ReverseProxy__Clusters__course-cluster__Destinations__destination1__Address=http://courseservice:80
      - ReverseProxy__Clusters__content-cluster__Destinations__destination1__Address=http://contentservice:80
      - ReverseProxy__Clusters__enrollment-cluster__Destinations__destination1__Address=http://enrollmentservice:80
      - ReverseProxy__Clusters__progress-cluster__Destinations__destination1__Address=http://progressservice:80
      - ReverseProxy__Clusters__assessment-cluster__Destinations__destination1__Address=http://assessmentservice:80
      - ReverseProxy__Clusters__certificate-cluster__Destinations__destination1__Address=http://certificateservice:80
      - ReverseProxy__Clusters__review-cluster__Destinations__destination1__Address=http://reviewservice:80
      - ReverseProxy__Clusters__notification-cluster__Destinations__destination1__Address=http://notificationservice:80
    depends_on:
      - identityservice
      - courseservice
      - categoryservice
      - contentservice
      - enrollmentservice
      - progressservice
      - assessmentservice
      - certificateservice
      - reviewservice
      - notificationservice
